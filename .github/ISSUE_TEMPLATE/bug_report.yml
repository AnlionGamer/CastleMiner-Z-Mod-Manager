name: Bug Report
description: Report a reproducible problem with CastleMiner Z Mod Manager
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with CastleMiner Z Mod Manager.

        Please do not upload CastleMiner Z game files, your full game installation, or unreviewed diagnostic files containing information you do not want public.

  - type: input
    id: manager-version
    attributes:
      label: Mod Manager version
      description: The CastleMiner Z Mod Manager version where the problem occurred.
      placeholder: "1.1.2"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: "Windows 11"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you were doing when it occurred.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Launch ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Relevant mods, tools, or setup details
      description: List anything that may affect reproduction, such as active mods, profile, installed tools, or whether the game was launched clean.
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or logs
      description: If useful, attach a Manager-generated sanitized diagnostics ZIP after reviewing it. Do not upload your CastleMiner Z installation or game files.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed any files I am attaching and understand that GitHub issues are public.
          required: true
